<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Wave Paths (Dynamic Visual Aspect) -->
  <path d="M 0,200 Q 300,120 600,200 T 1200,180 L 1200,300 L 0,300 Z" fill="url(#wave-grad)">
    <animate attributeName="d" 
             dur="8s" 
             repeatCount="indefinite"
             values="M 0,200 Q 300,120 600,200 T 1200,180 L 1200,300 L 0,300 Z;
                     M 0,180 Q 300,220 600,170 T 1200,210 L 1200,300 L 0,300 Z;
                     M 0,200 Q 300,120 600,200 T 1200,180 L 1200,300 L 0,300 Z" />
  </path>
  <path d="M 0,230 Q 300,280 600,210 T 1200,240 L 1200,300 L 0,300 Z" fill="#0284c7" opacity="0.2">
    <animate attributeName="d" 
             dur="10s" 
             repeatCount="indefinite"
             values="M 0,230 Q 300,280 600,210 T 1200,240 L 1200,300 L 0,300 Z;
                     M 0,250 Q 300,170 600,240 T 1200,200 L 1200,300 L 0,300 Z;
                     M 0,230 Q 300,280 600,210 T 1200,240 L 1200,300 L 0,300 Z" />
  </path>

  <!-- Floating Air Particles -->
  <circle cx="150" cy="80" r="4" fill="#38bdf8" opacity="0.6">
    <animate attributeName="cy" values="80;60;80" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="450" cy="60" r="6" fill="#34d399" opacity="0.5">
    <animate attributeName="cy" values="60;40;60" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="850" cy="90" r="5" fill="#a7f3d0" opacity="0.7">
    <animate attributeName="cy" values="90;70;90" dur="4.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="70" r="3" fill="#67e8f9" opacity="0.8">
    <animate attributeName="cy" values="70;50;70" dur="3.5s" repeatCount="indefinite" />
  </circle>

  <!-- Foreground Title and Subtitle (Crisp & High Contrast) -->
  <g text-anchor="middle" filter="url(#glow)">
    <text x="600" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="url(#text-grad)" letter-spacing="1">
      Awesome Air Quality Monitoring
    </text>
    <text x="600" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#e2e8f0" letter-spacing="0.5">
      Curated SaaS Platforms, APIs, Sensor Networks &amp; Open-Source Projects
    </text>
  </g>
</svg>
